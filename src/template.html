<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Talk Today — ZERO RISE</title>
<link rel="icon" href="icon.svg">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app">
  <div id="sky" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
  <header id="hud">
    <div id="hudCoins" class="hud-pill coins-pill" aria-label="Coins">
      <span class="sync-dot phone" id="syncDot" title="Saved on this phone"></span>
      <span aria-hidden="true">🪙</span>
      <span id="coinVal">0</span>
    </div>
    <div id="hudStreak" class="hud-pill streak-pill" aria-label="Streak">
      <span aria-hidden="true">🔥</span>
      <span id="streakVal">0</span>
    </div>
    <button id="hudGear" class="hud-pill gear-pill" type="button" aria-label="Beat off. Gear 1. Listen.">
      <span id="gearVal">1</span>
      <small id="gearName">Listen</small>
    </button>
    <div class="hud-actions">
      <button id="btnReplay" class="hbtn" type="button" aria-label="Hear it again">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 13c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 0 0 4 13c0 4.42 3.58 8 8 8v3l5-4-5-4v3z"/></svg>
      </button>
      <button id="btnSound" class="hbtn" type="button" aria-label="Sound on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <div id="who" class="who" aria-label="Signed in as Jamal Morelli">Jamal</div>
    </div>
  </header>

  <nav id="modeBar" aria-label="Practice">
    <button class="mode-tab active" type="button" data-mode="drill" aria-label="Drill">
      <span class="mode-icon" aria-hidden="true">⚡</span><span class="mode-name">Drill</span>
    </button>
    <button class="mode-tab" type="button" data-mode="find" aria-label="Find">
      <span class="mode-icon" aria-hidden="true">🔍</span><span class="mode-name">Find</span>
    </button>
    <button class="mode-tab" type="button" data-mode="speak" aria-label="Speak">
      <span class="mode-icon" aria-hidden="true">🎙️</span><span class="mode-name">Speak</span>
    </button>
    <button class="mode-tab" type="button" data-mode="memory" aria-label="Match">
      <span class="mode-icon" aria-hidden="true">🧠</span><span class="mode-name">Match</span>
    </button>
  </nav>

  <div id="load" aria-hidden="true"><span id="loadBar"></span></div>
  <main id="stage"></main>
  <p id="live" class="sr-only" aria-live="polite"></p>

  <div id="sheet" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="lesson-card" id="sheetCard"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
</div>
<script>
/*__JS__*/
</script>
</body>
</html>
