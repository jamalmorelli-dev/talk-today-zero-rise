<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Talk Today — ZERO RISE</title>
<link rel="icon" href="icon.svg">
<style>
:root {
  --bg-main: #070a13;
  --bg-surface: rgba(15, 23, 42, 0.75);
  --bg-card: rgba(30, 41, 59, 0.85);
  --border-glass: rgba(255, 255, 255, 0.12);
  --teal-neon: #00f0ff;
  --emerald: #10b981;
  --gold-coin: #f59e0b;
  --text-primary: #f8fafc;
  --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: #030712;
  color: var(--text-primary);
  font-family: var(--font-main);
  overflow: hidden;
}
button, .pillar-card, .find-tile, .mem-card { touch-action: manipulation; }
.word-plate, .sentence-line, .meaning-line, .lesson-word, .lesson-line, .lesson-bit { user-select: text; }

#app {
  position: relative;
  width: 100%;
  max-width: 520px;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  background: radial-gradient(circle at 50% 18%, #1e293b 0%, #070a13 55%, #030712 100%);
  display: flex;
  flex-direction: column;
  transition: background 0.6s ease;
}
#app.world-home { background: radial-gradient(circle at 50% 16%, #92400e 0%, #1c1008 48%, #070a13 100%); }
#app.world-outside { background: radial-gradient(circle at 50% 16%, #166534 0%, #052e16 46%, #070a13 100%); }
#app.world-class { background: radial-gradient(circle at 50% 16%, #1d4ed8 0%, #172554 48%, #070a13 100%); }
#app.world-food { background: radial-gradient(circle at 50% 16%, #c2410c 0%, #431407 48%, #070a13 100%); }
#app.world-play { background: radial-gradient(circle at 50% 16%, #7e22ce 0%, #2e1065 48%, #070a13 100%); }
#app.world-tech { background: radial-gradient(circle at 50% 16%, #0e7490 0%, #083344 48%, #070a13 100%); }
#app.world-city { background: radial-gradient(circle at 50% 16%, #a16207 0%, #292006 48%, #070a13 100%); }
#app.world-town { background: radial-gradient(circle at 50% 16%, #be123c 0%, #4c0519 48%, #070a13 100%); }
#app.shake { animation: screenShake 0.38s linear; }
@keyframes screenShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px) rotate(-0.4deg); }
  40% { transform: translateX(8px) rotate(0.4deg); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(4px); }
}

#hud {
  min-height: 60px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 8px;
  z-index: 30;
  background: rgba(7, 10, 19, 0.78);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-glass);
}
.hud-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 6px 8px;
  border-radius: 20px;
  background: var(--bg-surface);
  border: 1px solid var(--border-glass);
  font-weight: 800;
  font-size: 15px;
}
.coins-pill { border-color: rgba(245, 158, 11, 0.4); color: #fde047; }
.coins-pill.bump { animation: coinBump 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes coinBump {
  0% { transform: scale(1); }
  50% { transform: scale(1.18); }
  100% { transform: scale(1); }
}
.streak-pill { border-color: rgba(239, 68, 68, 0.35); color: #fca5a5; }
.streak-pill.lit { border-color: #ef4444; box-shadow: 0 0 14px rgba(239, 68, 68, 0.45); }
.gear-pill {
  border-color: rgba(0, 240, 255, 0.3);
  color: var(--teal-neon);
  cursor: pointer;
  font: inherit;
}
.gear-pill small {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); border: 0;
}
.gear-pill.on { box-shadow: 0 0 12px rgba(0, 240, 255, 0.35); }
.hud-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.who {
  min-height: 44px; padding: 0 8px; border-radius: 999px;
  display: flex; align-items: center; flex: 0 0 auto;
  border: 1px solid var(--border-glass);
  background: var(--bg-surface);
  color: #e2e8f0; font-size: 12px; font-weight: 800;
}
.hbtn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--border-glass);
  background: var(--bg-surface); color: #e2e8f0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.hbtn svg { width: 20px; height: 20px; }
.hbtn.muted { color: #64748b; }
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; display: inline-block;
}
.sync-dot.synced { background: #10b981; }
.sync-dot.phone { background: #f59e0b; }

#modeBar {
  display: flex; gap: 6px; padding: 6px 8px;
  background: rgba(11, 15, 29, 0.92);
  border-bottom: 1px solid var(--border-glass);
  z-index: 25;
}
.mode-tab {
  flex: 1; min-height: 48px; border-radius: 12px;
  border: 1px solid transparent; background: transparent; color: #94a3b8;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; cursor: pointer; font: inherit;
}
.mode-icon { font-size: 28px; line-height: 1; }
.mode-name {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); border: 0;
}
.mode-tab.active {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(0, 240, 255, 0.45);
  color: #fff;
}

#stage {
  flex: 1; position: relative;
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 12px 24px; overflow-y: auto; z-index: 10;
}

/* CEFR & Talk Today Lesson Plan Navigation */
.coursebook-nav {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 4px;
}

.cefr-pills {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
}
.cefr-pills::-webkit-scrollbar { display: none; }

.cefr-pill {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 32px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--bg-surface);
  border: 1px solid var(--border-glass);
  color: #94a3b8;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
}
.cefr-pill:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.25);
}
.cefr-pill.active {
  background: linear-gradient(135deg, rgba(0, 240, 255, 0.22), rgba(16, 185, 129, 0.18));
  border-color: var(--teal-neon);
  color: #ffffff;
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
}
.cefr-pill-badge {
  background: rgba(0, 240, 255, 0.18);
  color: var(--teal-neon);
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.3px;
}
.cefr-pill.active .cefr-pill-badge {
  background: var(--teal-neon);
  color: #070a13;
}
.cefr-pill-title {
  font-size: 10.5px;
  letter-spacing: 0.2px;
}

/* Talk Today Lesson Plan Interactive Banner */
.lp-card-banner {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px 10px;
  background: rgba(15, 23, 42, 0.72);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  text-align: left;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}
.lp-card-banner:hover {
  background: rgba(30, 41, 59, 0.88);
  border-color: rgba(0, 240, 255, 0.45);
}
.lp-badge-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.3px;
}
.lp-pill-level {
  background: linear-gradient(135deg, #0284c7, #0369a1);
  color: #fff;
  padding: 1px 5px;
  border-radius: 4px;
}
.lp-pill-code {
  background: rgba(245, 158, 11, 0.25);
  color: #fde047;
  padding: 1px 5px;
  border-radius: 4px;
}
.lp-pill-cohort {
  color: #94a3b8;
  font-size: 9px;
  font-weight: 600;
}
.lp-title-row {
  font-size: 13px;
  font-weight: 800;
  color: #f8fafc;
  line-height: 1.25;
  margin-top: 1px;
}
.lp-sub-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  color: #94a3b8;
}
.lp-sub-row span {
  color: var(--teal-neon);
}
.lp-sub-row small {
  color: #e2e8f0;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.08);
  padding: 1px 5px;
  border-radius: 4px;
}

/* Lesson Plan Modal / Inspection Sheet */
.lp-modal-content {
  display: flex;
  flex-direction: column;
  gap: 10px;
  color: #f8fafc;
  max-height: 75vh;
  overflow-y: auto;
  text-align: left;
}
.lp-modal-header {
  display: flex;
  gap: 8px;
  align-items: center;
}
.lp-badge-cefr {
  background: var(--teal-neon);
  color: #030712;
  font-weight: 900;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
}
.lp-badge-code {
  background: rgba(245, 158, 11, 0.3);
  color: #fde047;
  font-weight: 800;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
}
.lp-modal-title {
  font-size: 17px;
  font-weight: 800;
  line-height: 1.25;
}
.lp-modal-meta {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid var(--border-glass);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
}
.lp-meta-row strong {
  color: var(--teal-neon);
}
.lp-modal-vocab-label {
  font-size: 11px;
  font-weight: 800;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.lp-modal-vocab-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.lp-modal-word {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: rgba(30, 41, 59, 0.8);
  border: 1px solid var(--border-glass);
  border-radius: 10px;
  padding: 6px;
  cursor: pointer;
  color: #fff;
}
.lp-modal-word:hover {
  border-color: var(--teal-neon);
  transform: scale(1.04);
}
.lp-modal-word img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 8px;
}
.lp-modal-word span {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: capitalize;
}

.set-bar {
  width: 100%; display: flex; gap: 6px; overflow-x: auto;
  padding: 2px 0 8px; scrollbar-width: none;
}
.set-chip {
  position: relative;
  flex: 0 0 auto; width: 48px; height: 48px; min-height: 48px; padding: 0;
  border-radius: 14px; border: 2px solid var(--border-glass);
  background: var(--bg-surface); cursor: pointer; overflow: hidden;
  transition: opacity 0.2s ease, filter 0.2s ease;
}
.set-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.set-chip.active { border-color: var(--teal-neon); box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.35); }
.set-chip.done { border-color: var(--emerald); }
.set-chip.other-book, .set-chip.other-cefr { opacity: 0.4; filter: grayscale(0.5); }
.set-chip.other-book:hover, .set-chip.other-cefr:hover { opacity: 0.85; filter: grayscale(0); }
.set-chip.in-book, .set-chip.in-cefr { opacity: 1; }

.set-chip-tag {
  position: absolute;
  bottom: 2px;
  right: 2px;
  background: rgba(0, 0, 0, 0.85);
  color: #f8fafc;
  font-size: 8px;
  font-weight: 800;
  padding: 1px 3px;
  border-radius: 3px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  pointer-events: none;
  letter-spacing: 0.2px;
}

.prompt-line {
  font-size: 22px; font-weight: 800; text-align: center; min-height: 28px; margin: 4px 0;
}
.progress-line { color: #94a3b8; font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 6px; }
.pips { display: flex; gap: 5px; justify-content: center; margin: 4px 0 8px; flex-wrap: wrap; }
.pip { width: 10px; height: 10px; border-radius: 50%; background: #334155; }
.pip.ok { background: #38bdf8; }
.pip.strong { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.7); }

.play-orb {
  position: absolute; right: 10px; bottom: 10px; z-index: 6;
  width: 58px; height: 58px; border-radius: 50%; border: 0; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #38bdf8, #0284c7 70%, #0369a1);
  box-shadow: 0 0 24px rgba(2, 132, 199, 0.45);
  display: flex; align-items: center; justify-content: center;
}
.play-orb svg { width: 26px; height: 26px; fill: #fff; }
.play-orb.speaking { animation: callGlow 0.45s infinite alternate; }
@keyframes callGlow {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}

.word-plate {
  margin-top: 8px; font-size: 40px; font-weight: 900; letter-spacing: -0.03em; text-align: center;
}
.sentence-line { font-size: 18px; color: #cbd5e1; text-align: center; min-height: 24px; margin: 2px 0 4px; }
.meaning-line { font-size: 16px; color: #94a3b8; text-align: center; min-height: 0; margin: 0 0 8px; line-height: 1.35; }

.arena {
  position: relative; width: 100%; flex: 1; min-height: 58vh;
}
.pillar-card, .find-tile, .mem-card {
  background: #fff; border-radius: 28px; border: 3px solid #fff;
  overflow: hidden; cursor: pointer; position: relative;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 16px 30px rgba(0, 0, 0, 0.35);
}
.pillar-card {
  position: absolute; width: 40%; aspect-ratio: 1;
  animation: bob 2.6s ease-in-out infinite;
}
.pillar-card:nth-child(2) { left: 52%; top: 6%; animation-delay: -0.4s; }
.pillar-card:nth-child(3) { left: 8%; top: 42%; animation-delay: -1.1s; }
.pillar-card:nth-child(4) { left: 50%; top: 46%; animation-delay: -1.7s; }
.pillar-card.running { animation: none; }
.pillar-card:nth-child(5) { left: 30%; top: 22%; width: 34%; animation-delay: -0.8s; }
.arena.pack-5 .pillar-card { width: 34%; }
.pillar-card.win {
  z-index: 5; width: 68%; left: 16% !important; right: auto !important; top: 6% !important;
  animation: winPop 0.62s cubic-bezier(.15, 1.7, .28, 1) both;
  box-shadow:
    0 0 0 4px #fff,
    0 0 0 12px rgba(253, 224, 71, 0.9),
    0 0 48px 16px rgba(253, 224, 71, 0.55),
    0 28px 50px rgba(0, 0, 0, 0.45);
}
.pillar-card.yeet { animation: yeet 0.48s cubic-bezier(.4, 0, 1, 1) forwards; z-index: 2; }
.pillar-card.show-answer {
  z-index: 4; width: 58%; left: 21% !important; top: 12% !important;
  animation: jump 0.48s ease-in-out infinite;
  box-shadow: 0 0 0 6px #fde047, 0 18px 40px rgba(0, 0, 0, 0.4);
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-14px) rotate(2deg); }
}
@keyframes jump {
  0%, 100% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-22px) scale(1.06); }
}
@keyframes winPop {
  0% { transform: scale(0.7) rotate(-8deg); }
  60% { transform: scale(1.12) rotate(6deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes yeet {
  0% { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
  100% { transform: translateY(140%) rotate(96deg) scale(0.35); opacity: 0; }
}
.pillar-card img, .find-tile img, .mem-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.pillar-a { border-color: rgba(59, 130, 246, 0.55); }
.pillar-b { border-color: rgba(239, 68, 68, 0.5); }
.pillar-card.good-snap, .find-tile.good-snap, .hero.good-snap { border-color: var(--emerald); box-shadow: 0 0 24px rgba(16, 185, 129, 0.7); }
.pillar-card.ready, .find-tile.ready, .hero.ready { box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.7); }
.pillar-card.miss-snap, .find-tile.miss-snap { animation: missShake 0.35s ease-in-out; border-color: #dc2626; }
.pillar-card.show-answer { box-shadow: 0 0 0 3px #fde047; }
@keyframes missShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.find-grid, .mem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.find-tile { animation: bob 2.2s ease-in-out infinite; }
.find-tile:nth-child(2n) { animation-delay: -0.5s; }
.find-tile:nth-child(3n) { animation-duration: 2.9s; }
.find-tile.found { animation: winPop 0.45s cubic-bezier(.2, 1.6, .3, 1) both; }
.mem-card { animation: bob 2.8s ease-in-out infinite; }
.mem-card:nth-child(2n) { animation-delay: -0.7s; }
.mem-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.find-tile, .mem-card { aspect-ratio: 1; }
.find-tile.found { border-color: rgba(16, 185, 129, 0.7); }
.tile-word {
  position: absolute; left: 6px; right: 6px; bottom: 6px;
  background: rgba(3, 7, 18, 0.82); border-radius: 10px;
  text-align: center; font-weight: 800; font-size: 13px; padding: 3px 4px;
}
.mem-face { font-size: 28px; }
.mem-card.snd { border-color: rgba(0, 240, 255, 0.35); }
.mem-card.pic { border-color: rgba(59, 130, 246, 0.4); }
.mem-card.up { border-color: #fff; }
.mem-card svg { width: 36px; height: 36px; fill: #e2e8f0; }

.speak-view, .drill-view, .find-view, .mem-view {
  width: 100%; max-width: none; flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.hero {
  width: min(72vw, 280px); aspect-ratio: 1; border-radius: 36px; overflow: hidden;
  border: 4px solid #fff; background: #fff; cursor: pointer;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  animation: bob 1.5s ease-in-out infinite;
}
.hero.ready { animation: jump 0.55s ease-in-out infinite; }
.hero img { width: 100%; height: 100%; object-fit: cover; }
.mic-orb {
  width: 96px; height: 96px; border-radius: 50%; border: 0; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #ef4444, #b91c1c 70%);
  box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
  display: flex; align-items: center; justify-content: center;
}
.mic-orb svg { width: 42px; height: 42px; fill: #fff; }
.mic-ring {
  width: 116px; height: 116px; border-radius: 50%;
  display: grid; place-items: center; flex: 0 0 auto;
  background: conic-gradient(#4ade80 calc(var(--p, 0) * 100%), rgba(255,255,255,0.14) 0);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
}
.mic-orb.recording {
  background: radial-gradient(circle at 35% 30%, #22c55e, #15803d 70%);
  animation: callGlow 0.7s ease-in-out infinite alternate;
  box-shadow: 0 0 0 calc(6px + var(--level, 0) * 26px) rgba(74, 222, 128, 0.38);
}
.mic-orb.arming { opacity: 0.7; filter: saturate(0.7); }
.mic-orb:disabled { opacity: 0.45; cursor: default; }
.mic-orb.blocked { filter: grayscale(1); opacity: 0.4; }
#load {
  position: absolute; left: 0; right: 0; top: 0; z-index: 50;
  height: 6px; opacity: 0; pointer-events: none; overflow: hidden;
  background: rgba(255,255,255,0.16);
}
#load.on { opacity: 1; }
#loadBar {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, #22d3ee, #fde047 70%, #4ade80);
  box-shadow: 0 0 12px rgba(34, 211, 238, 0.8);
}
#load.busy #loadBar {
  width: 36%;
  animation: loadSlide 0.85s ease-in-out infinite;
}
@keyframes loadSlide {
  0% { transform: translateX(-130%); }
  100% { transform: translateX(320%); }
}
.status-line { min-height: 22px; text-align: center; color: #cbd5e1; font-weight: 700; }

.modal-backdrop {
  position: absolute; inset: 0; z-index: 80;
  background: rgba(3, 7, 18, 0.86); backdrop-filter: blur(14px);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal-backdrop.hidden { display: none; }
.lesson-card {
  width: min(96vw, 480px); max-height: min(90dvh, 720px); overflow: visible;
  background: transparent; border: 0;
  border-radius: 28px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 14px;
  box-shadow: none;
}
.lesson-kicker { font-size: 14px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5eead4; }
.lesson-card img { width: min(64vw, 220px); height: min(64vw, 220px); object-fit: cover; border-radius: 20px; }
.lesson-word { font-size: 40px; font-weight: 900; }
.lesson-line { font-size: 18px; color: #cbd5e1; text-align: center; }
.word-list { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.lesson-bit { font-size: 14px; color: #cbd5e1; text-align: left; line-height: 1.35; }
.lesson-bit b { color: #fff; }
.done-grid { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.done-pic {
  width: 30%; aspect-ratio: 1; padding: 0; border-radius: 22px; overflow: hidden;
  border: 3px solid #fff; background: #fff; cursor: pointer;
  animation: bob 1.8s ease-in-out infinite;
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
}
.done-pic:nth-child(2n) { animation-delay: -0.4s; }
.done-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.done-pic.on {
  width: 42%; border-color: #fde047;
  animation: jump 0.42s ease-in-out infinite;
  box-shadow: 0 0 28px rgba(253, 224, 71, 0.85);
}
.btn-next.icon-next {
  width: 76px; height: 76px; min-width: 76px; min-height: 76px; padding: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.icon-next svg { width: 34px; height: 34px; }
.btn-next, .btn-ghost {
  min-height: 52px; min-width: 140px; padding: 0 22px; border-radius: 999px;
  border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 18px;
}
.btn-next { background: #10b981; color: #042f1c; }
.btn-ghost { background: transparent; color: #e2e8f0; border: 1px solid var(--border-glass); }
.code-row { display: flex; gap: 8px; }
.code-row img { width: 84px; height: 84px; border-radius: 16px; object-fit: cover; }
.code-row span { display: block; text-align: center; font-size: 12px; font-weight: 800; margin-top: 4px; }

.gate {
  position: absolute; inset: 0; z-index: 70; overflow-y: auto;
  background: #070a13; padding: 18px 14px 28px;
  display: flex; flex-direction: column; gap: 10px;
}
.gate.hidden { display: none; }
.gate h1 { font-size: 28px; line-height: 1.1; }
.gate p { color: #cbd5e1; font-size: 16px; }
.slots { display: flex; gap: 8px; min-height: 74px; }
.slot {
  width: 72px; height: 72px; border-radius: 16px; border: 1px dashed rgba(255,255,255,0.25);
  overflow: hidden; background: rgba(255,255,255,0.04);
}
.slot img { width: 100%; height: 100%; object-fit: cover; }
.pic-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pic-pick {
  aspect-ratio: 1; border-radius: 14px; overflow: hidden; border: 2px solid transparent;
  padding: 0; background: #111827; cursor: pointer; position: relative;
}
.pic-pick img { width: 100%; height: 100%; object-fit: cover; }
.pic-pick.on { border-color: var(--teal-neon); }
.pic-pick em {
  position: absolute; left: 0; right: 0; bottom: 0; font-style: normal;
  background: rgba(0,0,0,0.72); font-size: 10px; font-weight: 800; padding: 2px;
}
.gate-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); border: 0;
}
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

#sky { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; color: #38bdf8; }
#sky i, #sky b { position: absolute; display: block; border-radius: 50%; }
#sky i { background: currentColor; filter: blur(10px); opacity: 0.45; animation: drift 16s ease-in-out infinite; }
#sky i:nth-child(1) { width: 200px; height: 200px; left: -50px; top: 16%; }
#sky i:nth-child(2) { width: 140px; height: 140px; right: -30px; top: 38%; animation-duration: 12s; animation-delay: -4s; opacity: 0.35; }
#sky i:nth-child(3) { width: 90px; height: 90px; left: 38%; top: 8%; animation-duration: 9s; animation-delay: -2s; opacity: 0.5; }
#sky b {
  width: 150%; height: 30%; left: -25%; bottom: -10%;
  background: radial-gradient(ellipse at center, rgba(255,255,255,0.2), transparent 68%);
  filter: blur(4px);
}
#sky::before {
  content: '';
  position: absolute; inset: -30%;
  background: conic-gradient(from 120deg, transparent, currentColor, transparent 32%, transparent 68%, currentColor, transparent);
  opacity: 0.16; filter: blur(36px);
  animation: spinSky 32s linear infinite;
}
@keyframes drift {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(24px, -30px, 0) scale(1.12); }
}
@keyframes spinSky { to { transform: rotate(360deg); } }
#app.world-home #sky { color: #fbbf24; }
#app.world-outside #sky { color: #4ade80; }
#app.world-class #sky { color: #60a5fa; }
#app.world-food #sky { color: #fb923c; }
#app.world-play #sky { color: #e879f9; }
#app.world-tech #sky { color: #22d3ee; }
#app.world-city #sky { color: #facc15; }
#app.world-town #sky { color: #fb7185; }
#app.hot #sky i { opacity: 0.8; filter: blur(6px); }
#app.blaze { box-shadow: inset 0 0 90px rgba(251, 146, 60, 0.38); }
#app::before {
  content: '';
  position: absolute; inset: 0; z-index: 20; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 42%, rgba(0, 0, 0, 0.5) 100%);
}
#app.flash::after {
  content: '';
  position: absolute; inset: 0; z-index: 46; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, rgba(255,255,255,0.62), transparent 58%);
  animation: flashOut 0.34s ease-out forwards;
}
@keyframes flashOut {
  0% { opacity: 0.85; }
  100% { opacity: 0; }
}
.pillar-card::after, .find-tile::after, .mem-card::after, .hero::after, .done-pic::after {
  content: '';
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
  background: linear-gradient(155deg, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.06) 30%, transparent 48%, rgba(0,0,0,0.22) 100%);
}
.hero, .done-pic { position: relative; }
.set-chip:not(.active) { animation: floaty 3.6s ease-in-out infinite; }
.set-chip:nth-child(2n):not(.active) { animation-delay: -1.2s; }
@keyframes floaty {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
.pip.strong { animation: pipPulse 1.3s ease-in-out infinite; }
@keyframes pipPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.45); }
}
.play-orb.speaking { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0.35), 0 0 32px rgba(2, 132, 199, 0.7); }
.hero.ready { box-shadow: 0 0 0 6px rgba(0, 240, 255, 0.45), 0 0 36px rgba(0, 240, 255, 0.55); }
#app.world-home .pillar-card { border-color: #fde68a; }
#app.world-outside .pillar-card { border-color: #bbf7d0; }
#app.world-class .pillar-card { border-color: #bfdbfe; }

#app.world-play .pillar-card { border-color: #f5d0fe; }
#app.world-tech .pillar-card { border-color: #a5f3fc; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  #load.busy #loadBar { width: 100% !important; transform: none !important; opacity: 0.75; }
}

<script>
/* ZERO RISE lesson engine. Pure functions. English only. No DOM. */
const TT = {
  PICS: ['pizza', 'banana', 'taxi', 'bus', 'doctor', 'police', 'football', 'camera', 'coffee', 'tomato', 'robot', 'radio'],
  BOOKS: [
    { id: 'kids', name: 'Super Minds 1', code: 'SM1', series: 'Cambridge Super Minds', level: 'Kids Level Zero', icon: '📘' },
    { id: 'teens', name: 'Gateway to the World', code: 'GTTW', series: 'Macmillan Gateway', level: 'Teens A1–A1+', icon: '🌍' },
    { id: 'adults', name: 'Talk Keynote', code: 'KEYNOTE', series: 'National Geographic Keynote & Voices', level: 'Adults A1–A2', icon: '💼' }
  ],
  CEFR: [
    { id: 'pre-a1', code: 'PRE-A1', label: 'PRE-A1', name: 'Starter Foundations', icon: '📘', book: 'Super Minds 1', publisher: 'Cambridge', cohort: 'Kids 4–8 · Zero Level' },
    { id: 'pre-a1-a1', code: 'PRE-A1–A1', label: 'PRE-A1 → A1', name: 'Elementary Bridge', icon: '🌍', book: 'Gateway to the World', publisher: 'Macmillan', cohort: 'Upper Kids & Teens 9–14' },
    { id: 'a1-a1plus', code: 'A1–A1+', label: 'A1 → A1+', name: 'Everyday Fluency', icon: '💼', book: 'Talk Keynote', publisher: 'National Geographic', cohort: 'Teens 15+ & Adults' }
  ],
  SETS: [

    },

      id: 'outside',
      cefrId: 'pre-a1',

      bookId: 'kids',
      book: 'Super Minds 1',
      bookCode: 'SM1',
      unit: 'Unit 2: Animals & Nature',
      lpTitle: 'Animals, Pets & Nature Adventure',
      lpCode: 'TT-LP-02',
      teacher: 'Meriam / Douae',
      cohort: 'PRE-A1 | KIDS 6–9',

    },

    },

    },
    {

      bookId: 'teens',
      book: 'Gateway to the World',
      bookCode: 'GTTW',

      cohort: 'PRE-A1–A1 | UPPER KIDS 9–11',
      name: 'Sports & Sounds',
      words: ['football', 'tennis', 'music', 'camera', 'robot', 'radio']
    },
    {
      id: 'tech',

      bookId: 'teens',
      book: 'Gateway to the World',

      name: 'City Services',
      words: ['hospital', 'doctor', 'police', 'pharmacy', 'bank', 'passport', 'coffee', 'money']
    }
  ],
  GROUPS: {
    food: ['apple', 'banana', 'pizza', 'burger', 'chocolate', 'tomato', 'orange', 'water', 'coffee'],
    animals: ['cat', 'dog', 'fish'],
    school: ['book', 'pen', 'pencil', 'bag', 'backpack'],
    home: ['door', 'window', 'cup', 'bed'],
    ride: ['car', 'taxi', 'bus', 'train', 'bicycle'],
    place: ['hotel', 'hospital', 'pharmacy', 'bank', 'station', 'airport'],
    people: ['doctor', 'police'],
    tech: ['computer', 'telephone', 'television', 'radio', 'headphones', 'camera'],
    sport: ['football', 'tennis', 'ball'],
    wear: ['sneakers', 'jacket'],
    other: ['robot', 'music', 'money', 'passport', 'tree']
  },
  /* These files exist as s_ (slow word) and f_ ("Where is the …?"). Text must match that recording. */
  QUESTION: ['banana', 'burger', 'bus', 'camera', 'chocolate', 'coffee', 'computer', 'doctor', 'football', 'hotel', 'money', 'music', 'orange', 'pizza', 'police', 'radio', 'robot', 'taxi', 'telephone', 'television', 'tennis', 'tomato', 'train', 'water']
};

TT.WORDS = TT.SETS.reduce((a, s) => a.concat(s.words), []);
TT.QSET = {};
TT.QUESTION.forEach(w => { TT.QSET[w] = 1; });

TT.setById = function (id) {
  for (let i = 0; i < TT.SETS.length; i++) if (TT.SETS[i].id === id) return TT.SETS[i];
  return TT.SETS[0];
};

TT.bookById = function (bookId) {
  for (let i = 0; i < TT.BOOKS.length; i++) if (TT.BOOKS[i].id === bookId) return TT.BOOKS[i];
  return TT.BOOKS[0];
};

TT.bookOfSet = function (setId) {
  const s = TT.setById(setId);
  return TT.bookById(s.bookId);
};

TT.setsByBook = function (bookId) {
  return TT.SETS.filter(s => s.bookId === bookId);
};

TT.cefrById = function (cefrId) {
  for (let i = 0; i < TT.CEFR.length; i++) if (TT.CEFR[i].id === cefrId) return TT.CEFR[i];
  return TT.CEFR[0];
};

TT.cefrOfSet = function (setId) {
  const s = TT.setById(setId);
  return TT.cefrById(s.cefrId);
};

TT.setsByCefr = function (cefrId) {
  return TT.SETS.filter(s => s.cefrId === cefrId);
};

TT.groupOf = function (word) {
  const keys = Object.keys(TT.GROUPS);
  for (let i = 0; i < keys.length; i++) if (TT.GROUPS[keys[i]].indexOf(word) >= 0) return keys[i];
  return '';
};

TT.hasQuestion = function (word) { return !!TT.QSET[word]; };

TT.article = function (word) { return /^[aeiou]/.test(word) ? 'an' : 'a'; };

TT.sentence = function (word) {
  if (TT.hasQuestion(word)) return 'Where is the ' + word + '?';
  return 'It is ' + TT.article(word) + ' ' + word + '.';
};

/* Extra English, shown on screen after a hit. Not a recording. */
TT.USE = {
  door: 'You open a door.',
  window: 'You look through a window.',
  cup: 'A cup holds a drink.',
  bed: 'You sleep in a bed.',
  bag: 'A bag holds your things.',

  music: 'You listen to music.',
  camera: 'A camera takes a picture.',
  robot: 'A robot is a machine.',

  computer: 'You type on a computer.',
  telephone: 'You talk on a telephone.',

  sneakers: 'Sneakers go on your feet.',

  train: 'A train runs on tracks.',
  station: 'You catch a train at a station.',
  airport: 'Planes leave from an airport.',
  hotel: 'You sleep at a hotel.',
  hospital: 'A hospital helps sick people.',
  doctor: 'A doctor helps sick people.',
  police: 'The police keep people safe.',
  pharmacy: 'A pharmacy has medicine.',
  bank: 'A bank keeps money safe.',
  passport: 'A passport is for travel.',
  coffee: 'Coffee is a hot drink.',
  money: 'You pay with money.'
};

TT.useLine = function (word) { return TT.USE[word] || ''; };

TT.blankMastery = function () { return { taps: 0, ok: 0, says: 0, sayOK: 0, next: 0, heard: 0 }; };

TT.levelOf = function (m) {
  m = m || {};
  const taps = m.taps || 0, ok = m.ok || 0, sayOK = m.sayOK || 0;
  const acc = taps ? ok / taps : 0;
  let lv = 0;
  if (ok >= 1) lv = 1;
  if (ok >= 2 && acc >= 0.6) lv = 2;
  if (sayOK >= 1 && lv >= 1) lv = Math.min(3, lv + 1);
  return lv;
};

/* Hours until the word is due again. Inside a session the queue also rotates. */
TT.delayMs = function (level) {
  return [0, 12 * 60 * 1000, 24 * 3600000, 72 * 3600000][level] || 0;
};

TT.gearOf = function (words, mastery) {
  let strong = 0;
  for (let i = 0; i < words.length; i++) if (TT.levelOf(mastery[words[i]]) >= 2) strong++;
  if (words.length >= 4 && strong >= Math.ceil(words.length * 0.7)) return 3;
  if (strong >= 2) return 2;

      g.gain.setValueAtTime(0.08, now);
    } else {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(900, now);
      g.gain.setValueAtTime(0.04, now);
    }
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
    osc.start(now); osc.stop(now + 0.1);
  }, half);
}

let syncTimer = null;
let syncBlockedUntil = 0;
function syncSoon() {
  clearTimeout(syncTimer);
  if (Date.now() < syncBlockedUntil) return;
  syncTimer = setTimeout(syncNow, 600);
}
function setSync(kind) {
  const dot = $('syncDot');
  dot.className = 'sync-dot ' + kind;
  dot.title = kind === 'synced' ? 'Synced' : 'Saved on this phone';
}
async function postAPI(body, ms) {
  const job = beginLoad();
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, ms || 15000);
  try {
    const res = await fetch(CFG.API, {
      method: 'POST',
      body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    });
    return await res.json();
  } finally {
    clearTimeout(timer);
    endLoad(job);
  }
}
async function syncNow() {
  if (!CFG.API || !S.id) { setSync('phone'); return; }
  const batch = S.events.slice(0, 120);
  try {
    const data = await postAPI({
      action: 'sync', id: S.id, cls: S.cls || '', events: batch,
      state: { xp: S.coins, stars: starMap(), learned: learnedList(), streak: S.streak, mic: { label: '' } }
    });
    if (data && data.ok) {
      S.events = S.events.slice(batch.length);
      try { localStorage.setItem('ttzr4_state', JSON.stringify(S)); } catch (e) {}
      setSync('synced');
    } else {
      setSync('phone');
      syncBlockedUntil = Date.now() + 20000;
    }
  } catch (e) {
    setSync('phone');
    syncBlockedUntil = Date.now() + 20000;
  }
}

/* ---------- DRILL ---------- */
let drill = null;
function renderDrill() {
  const gen = ++viewGen;
  stopTalk();
  const set = curSet();
  const word = TT.orderWords(set.words, S.mastery, Date.now())[0];
  const gear = TT.gearOf(set.words, S.mastery);
  const kind = TT.stimulus(word, S.mastery[word], gear);
  const crowd = set.words.filter(w => w !== word);
  for (let i = crowd.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = crowd[i]; crowd[i] = crowd[j]; crowd[j] = t;
  }
  const foilN = crowd.length >= 4 ? 4 : crowd.length;
  const pack = [word].concat(crowd.slice(0, foilN));
  for (let i = pack.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = pack[i]; pack[i] = pack[j]; pack[j] = t;
  }
  S.currentWord = word;
  drill = { gen, word, kind, misses: 0, phase: 'play' };
  stopLive();
  const cards = pack.map(w =>
    '<button type="button" class="pillar-card" data-word="' + w + '" aria-label="Picture"><img src="' + CFG.ASSET + 'img/' + w + '.jpg" alt=""></button>'
  ).join('');
  stage.innerHTML = '<div class="drill-view">' + chrome(
    '<div class="arena' + (pack.length >= 5 ? ' pack-5' : '') + '" id="arena">' + cards +
      '<button type="button" class="play-orb" id="hearBtn" aria-label="Hear the word"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>' +
    '</div></div>'
  );
  bindSets(renderDrill);
  renderHUD();
  $('hearBtn').onclick = () => hearDrill(true);
  stage.querySelectorAll('.pillar-card').forEach(card => card.onclick = () => answerDrill(card));
  setPrompt(gear >= 3 && kind === 'f' ? 'Where is it?' : (TT.levelOf(S.mastery[word]) >= 1 ? 'You know this one.' : 'Listen.'));
  if (!holdAutoplay) hearDrill(false, gen);
}
async function hearDrill(manual, gen) {
  if (!drill) return;
  const g = gen || drill.gen;
  const btn = $('hearBtn');
  if (btn) btn.classList.add('speaking');
  await playUrls([file(drill.kind, drill.word)]);
  if (g !== viewGen) return;
  const btn2 = $('hearBtn');
  if (btn2) btn2.classList.remove('speaking');
  if (!manual) {
    drill.phase = 'answer';
    chase($('arena'), '.pillar-card');
    sfxArm();
    setPrompt('Tap the picture.');
  }
}
async function answerDrill(card) {
  if (!drill || drill.phase !== 'answer') return;
  const picked = card.dataset.word;
  if (picked === drill.word) {
    drill.phase = 'next';
    const noted = noteTap(drill.word, true);
    S.streak++;
    stopLive();
    card.style.transform = '';
    card.classList.add('win');
    stage.querySelectorAll('.pillar-card').forEach(c => {
      if (c === card) return;
      c.style.transform = '';
      c.classList.add('yeet');
    });
    burstAt(card);
    blip(true);
    sfxWhoosh();
    poke(16);
    setPrompt('Nice.');
    logEvent({ type: 'tap', word: drill.word, correct: 1, misses: drill.misses, ms: 0 });
    pay(noted.gained);
    const urls = [voiceClip(drill.word)];
    if (S.streak > 0 && S.streak % 3 === 0) urls.push(cue(S.streak % 6 === 0 ? 'wow' : 'yay'));
    await playUrls(urls);
    if (drill.gen !== viewGen) return;
    if (!maybeClearSet()) setTimeout(() => { if (drill && drill.gen === viewGen) renderDrill(); }, 140);
  } else {
    noteTap(drill.word, false);
    S.streak = 0;
    drill.misses++;
    card.classList.add('miss-snap');
    shake();
    blip(false);
    poke(28);
    setPrompt('Try again.');
    logEvent({ type: 'tap', word: drill.word, correct: 0, misses: drill.misses, ms: 0 });
    save();
    if (drill.misses >= 2) {
      stopLive();
      stage.querySelectorAll('.pillar-card').forEach(c => {
        c.style.transform = '';
        if (c.dataset.word === drill.word) c.classList.add('show-answer');
        else c.classList.add('yeet');
      });
      sfxWhoosh();
    }
    setTimeout(() => card.classList.remove('miss-snap'), 360);
    await playUrls([cue('oops'), file(drill.kind, drill.word)]);
  }
}

async function hearFind(manual) {
  if (!findRound || findRound.cursor >= findRound.words.length) return;
  const word = findRound.words[findRound.cursor];
  S.currentWord = word;
  const gear = TT.gearOf(curSet().words, S.mastery);
  const kind = TT.stimulus(word, S.mastery[word], gear);
  findRound.kind = kind;
  const btn = $('hearBtn');
  if (btn) btn.classList.add('speaking');
  await playUrls([file(kind, word)]);
  if (!findRound || findRound.gen !== viewGen) return;
  const btn2 = $('hearBtn');
  if (btn2) btn2.classList.remove('speaking');
  if (!manual) {
    findRound.phase = 'answer';
    stage.querySelectorAll('.find-tile').forEach(t => { if (!t.classList.contains('found')) t.classList.add('ready'); });
    sfxArm();
    setPrompt('Tap the picture.');
  }
}
function answerFind(tile) {
  if (!findRound || findRound.phase !== 'answer') return;
  const word = findRound.words[findRound.cursor];
  const picked = tile.dataset.word;
  if (findRound.found[picked]) return;
  if (picked !== word) {
    tile.classList.add('miss-snap');
    shake();
    blip(false);
    noteTap(word, false);
    setPrompt('Try again.');
    S.streak = 0;
    logEvent({ type: 'tap', word: word, correct: 0, misses: 1, ms: 0 });
    save();
    setTimeout(() => tile.classList.remove('miss-snap'), 360);
    playUrls([cue('oops'), file(findRound.kind, word)]);
    return;
  }
  findRound.phase = 'next';
  findRound.found[word] = 1;
  const noted = noteTap(word, true);
  S.streak++;
  tile.classList.add('found', 'good-snap');
  tile.classList.remove('ready');
  burstAt(tile);
  blip(true);
  poke(12);
  setPrompt(TT.sentence(word));
  logEvent({ type: 'tap', word: word, correct: 1, misses: 0, ms: 0 });
  pay(noted.gained);
  playUrls([voiceClip(word)]).then(() => {
    if (!findRound || findRound.gen !== viewGen) return;
    findRound.cursor++;
    if (findRound.cursor >= findRound.words.length) {
      setPrompt('You found them.');
      playUrls([cue('great')]);
      if (!maybeClearSet()) setTimeout(() => { if (findRound && findRound.gen === viewGen) renderFind(); }, 700);
      return;
    }
    findRound.phase = 'play';
    hearFind(false);
  });
}

}
function releaseMic() {
  rec.on = false;
  if (rec.timer) { clearTimeout(rec.timer); rec.timer = null; }
  if (rec.unmeter) { try { rec.unmeter(); } catch (e) {} rec.unmeter = null; }
  const stop = rec.stop;
  const stream = rec.stream;
  rec.stop = null;
  endKind('mic');
  const btn = $('micBtn');
  if (btn) btn.classList.remove('recording', 'arming');
  const ring = $('micRing');
  if (ring) ring.style.setProperty('--p', '0');
  if (stop) {
    try { stop(); } catch (e) {}
    setTimeout(() => dropTracks(stream), 70);
  } else dropTracks(stream);
}
function meter(stream) {
  const ctx = ensureAudio();
  if (!ctx) return function () {};
  let src, an, dead = false;
  try {
    src = ctx.createMediaStreamSource(stream);
    an = ctx.createAnalyser();
    an.fftSize = 512;
    src.connect(an);
  } catch (e) { return function () {}; }
  const buf = new Uint8Array(an.fftSize);
  const tick = () => {
    if (dead) return;
    an.getByteTimeDomainData(buf);
    let s = 0;
    for (let i = 0; i < buf.length; i++) {
      const v = (buf[i] - 128) / 128;
      s += v * v;
    }
    const btn = $('micBtn');
    if (btn) btn.style.setProperty('--level', Math.min(1, Math.sqrt(s / buf.length) * 12).toFixed(3));
    requestAnimationFrame(tick);
  };
  if (ctx.state === 'suspended') ctx.resume();
  tick();
  return function () { dead = true; try { src.disconnect(); } catch (e) {} };
}
async function openMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no_mic');
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: MIC_AUDIO });
  } catch (e) {
    if (e && (e.name === 'OverconstrainedError' || e.name === 'ConstraintNotSatisfiedError')) {
      return navigator.mediaDevices.getUserMedia({ audio: true });
    }
    throw e;
  }
}
async function toggleMic() {
  if (!speak || !speak.heardModel) return;
  if (rec.on) {
    if (performance.now() - rec.startedAt < 420) return;
    if (rec.stop) rec.stop();
    return;
  }
  if (rec.busy) return;
  rec.busy = true;
  const gen = speak.gen;
  const word = speak.word;
  stopTalk();
  ensureAudio();
  const btn = $('micBtn');
  if (btn) btn.classList.add('arming');
  const arm = beginLoad(null, 'mic');
  try {
    const stream = await openMic();
    if (!speak || speak.gen !== gen) {
      stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
      endLoad(arm);
      return;
    }
    endLoad(arm);
    rec.stream = stream;
    rec.on = true;
    rec.startedAt = performance.now();
    stream.getTracks().forEach(t => {
      t.addEventListener('ended', () => { if (rec.on && rec.stop) rec.stop(); });
    });
    if (btn) { btn.classList.remove('arming'); btn.classList.add('recording'); }
    $('speakStatus').textContent = 'Listening…';
    rec.unmeter = meter(stream);
    const job = beginLoad(0, 'mic');
    let raf = 0;
    const pump = () => {
      if (!rec.on) return;
      const p = Math.min(1, (performance.now() - rec.startedAt) / REC_MS);
      setLoad(job, p);
      const ring = $('micRing');
      if (ring) ring.style.setProperty('--p', p.toFixed(3));
      raf = requestAnimationFrame(pump);
    };
    raf = requestAnimationFrame(pump);
    const stopPump = () => { cancelAnimationFrame(raf); endLoad(job); };
    let result = null;
    const mime = pickMime();
    if (window.MediaRecorder && mime) result = await recordMime(stream, mime);
    if (!result || result.fallback) {
      if (rec.on && rec.stream) result = await recordWav(rec.stream, Math.max(500, REC_MS - (performance.now() - rec.startedAt)));
    }
    stopPump();
    releaseMic();
    if (!speak || speak.gen !== gen) return;
    if (!result || result.empty || !result.b64) {
      setPrompt('Try again.');
      if ($('speakStatus')) $('speakStatus').textContent = 'We did not hear you. Come closer and say the word.';
      playUrls([cue('goodtry'), file('w', word)]);
      return;
    }
    await judge(result.b64, result.mime, word, gen);
  } catch (e) {
    endKind('mic');
    releaseMic();
    if (!speak || speak.gen !== gen) return;
    const mic = $('micBtn');
    if (mic) mic.classList.add('blocked');
    setPrompt('The microphone is blocked.');
    playUrls([cue('oops')]);
  } finally {
    rec.busy = false;
    const b = $('micBtn');
    if (b) b.classList.remove('recording', 'arming');
  }
}
function pickMime() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  return ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/ogg'].find(t => {
    try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; }
  }) || '';
}
function recordMime(stream, mime) {
  return new Promise(resolve => {
    let mr;
    try { mr = new MediaRecorder(stream, { mimeType: mime }); }
    catch (e) { resolve({ fallback: true }); return; }
    const chunks = [];
    let settled = false;
    let fallback = false;
    const settle = (payload) => { if (settled) return; settled = true; resolve(payload); };
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onerror = () => {
      fallback = true;
      try { if (mr.state !== 'inactive') mr.stop(); } catch (e) {}
      settle({ fallback: true });
    };
    mr.onstop = async () => {
      if (fallback) { settle({ fallback: true }); return; }
      try {
        const blob = new Blob(chunks, { type: mime });
        if (blob.size < 800) { settle({ empty: true }); return; }
        const b64 = await blobToB64(blob);
        settle({ b64: b64, mime: mime.split(';')[0] });
      } catch (e) { settle({ fallback: true }); }
    };
    rec.stop = () => {
      try { if (mr.state === 'recording') mr.requestData(); } catch (e) {}
      try { if (mr.state !== 'inactive') mr.stop(); } catch (e) { settle({ fallback: true }); }
    };
    try { mr.start(100); }
    catch (e) { settle({ fallback: true }); return; }
    if (rec.timer) clearTimeout(rec.timer);
    rec.timer = setTimeout(() => { if (rec.on && rec.stop) rec.stop(); }, REC_MS);
  });
}
function recordWav(stream, ms) {
  return new Promise(resolve => {
    const ctx = ensureAudio();
    if (!ctx) { resolve({ empty: true }); return; }
    const run = () => {
      let src, proc, silent;
      try {
        src = ctx.createMediaStreamSource(stream);
        proc = ctx.createScriptProcessor(4096, 1, 1);
        silent = ctx.createGain();
        silent.gain.value = 0.00001;
      } catch (e) { resolve({ empty: true }); return; }
      const pieces = [];
      src.connect(proc); proc.connect(silent); silent.connect(ctx.destination);
      proc.onaudioprocess = e => pieces.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        try { proc.disconnect(); src.disconnect(); silent.disconnect(); } catch (e) {}
        if (!pieces.length) { resolve({ empty: true }); return; }
        resolve({ b64: wavB64(pieces, ctx.sampleRate), mime: 'audio/wav' });
      };
      rec.stop = finish;
      if (rec.timer) clearTimeout(rec.timer);
      rec.timer = setTimeout(() => { if (rec.on) finish(); }, Math.max(400, ms));
    };
    if (ctx.state === 'suspended') ctx.resume().then(run).catch(() => resolve({ empty: true }));
    else run();
  });
}
function blobToB64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onloadend = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
function wavB64(pieces, rate) {
  let n = 0;
  pieces.forEach(p => { n += p.length; });
  const samples = new Float32Array(n);
  let o = 0;
  pieces.forEach(p => { samples.set(p, o); o += p.length; });
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, samples.length * 2, true);
  let q = 44;
  for (let i = 0; i < samples.length; i++, q += 2) {
    const x = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(q, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  let bin = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
async function judge(b64, mime, word, gen) {
  if (!speak || speak.gen !== gen || speak.word !== word) return;
  const status = $('speakStatus');
  if (status) status.textContent = 'Checking…';
  const m = mOf(word);
  m.says++;
  try {
    const data = await postAPI({
      action: 'speak', id: S.id, word: word, audio: b64, mime: mime,
      session: S.session, lesson: TT.SETS.findIndex(s => s.id === S.setId) + 1,
      try: m.says, ms: REC_MS, mic: ''
    }, 22000);
    if (!speak || speak.gen !== gen) return;
    if (data && data.silent) {
      setPrompt('Try again.');
      status.textContent = 'We did not hear you. Come closer and say the word.';
      logEvent({ type: 'say', word: word, correct: 0, heard: '', score: 0, engine: 'whisper' });
      save();
      playUrls([cue('goodtry'), file('w', word)]);
      return;
    }
    if (data && data.ok && data.pass) {
      const before = TT.levelOf(m);
      m.sayOK++;
      const after = TT.levelOf(m);
      m.next = Date.now() + TT.delayMs(after);
      S.streak++;
      const hero = $('hero');
      if (hero) { hero.classList.add('good-snap'); burstAt(hero); }
      blip(true);
      poke(20);
      setPrompt('Nice.');
      status.textContent = 'We heard “' + (data.heard || word) + '”.';
      logEvent({ type: 'say', word: word, correct: 1, heard: data.heard || '', score: data.score, engine: 'whisper' });
      pay(after > before ? 2 : 0);
      await playUrls([cue('great')]);
      if (speak && speak.gen === gen && !maybeClearSet()) renderSpeak();
      return;
    }
    setPrompt('Try again.');
    status.textContent = data && data.heard ? 'We heard “' + data.heard + '”.' : 'Not the word yet.';
    logEvent({ type: 'say', word: word, correct: 0, heard: (data && data.heard) || '', score: data && data.score, engine: 'whisper' });
    save();
    playUrls([cue('goodtry'), file('w', word)]);
  } catch (e) {
    if (!speak || speak.gen !== gen) return;
    setPrompt('Not scored yet.');
    if (status) status.textContent = 'Saved on this phone. The teacher line is offline. Say it again.';
    logEvent({ type: 'say', word: word, correct: 0, heard: '', engine: 'offline' });
    save();
    playUrls([cue('oops')]);
  }
}

/* ---------- MATCH ---------- */
function renderMemory() {
  const gen = ++viewGen;
  stopTalk();
  const set = curSet();
  let words = TT.orderWords(set.words, S.mastery, Date.now()).slice(0, 4);
  if (words.length < 2) words = set.words.slice(0, 2);
  const deck = [];
  words.forEach(w => { deck.push({ id: w, type: 'snd' }); deck.push({ id: w, type: 'pic' }); });
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = deck[i]; deck[i] = deck[j]; deck[j] = t;
  }
  const cards = deck.map((c, i) =>
    '<button type="button" class="mem-card ' + (c.type === 'snd' ? 'snd' : 'pic') + '" data-i="' + i + '" aria-label="' + (c.type === 'snd' ? 'Sound card' : 'Picture card') + '">' +
    (c.type === 'snd'
      ? '<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5L19 18H5l3.5-4.5z"/></svg>') +
    '</button>'
  ).join('');
  stage.innerHTML = '<div class="mem-view">' + chrome(
    '<div class="mem-grid' + (deck.length > 6 ? ' cols-4' : '') + '">' + cards + '</div></div>'
  );
  bindSets(renderMemory);
  renderHUD();
  setPrompt('Match the sound and the picture.');
  let open = [];
  let lock = false;
  const matched = {};
  stage.querySelectorAll('.mem-card').forEach(card => card.onclick = async () => {
    const i = +card.dataset.i;
    const c = deck[i];
    if (lock || matched[i] || open.indexOf(i) >= 0) return;
    card.classList.add('up');
    if (c.type === 'snd') {
      card.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>';
      playUrls([file('w', c.id)]);
    } else {
      card.innerHTML = '<img src="' + CFG.ASSET + 'img/' + c.id + '.jpg" alt="">';
    }
    open.push(i);
    if (open.length < 2) return;
    const a = deck[open[0]], b = deck[open[1]];
    if (a.id === b.id && a.type !== b.type) {
      matched[open[0]] = matched[open[1]] = 1;
      const noted = noteTap(a.id, true);
      S.streak++;
      setPrompt(TT.sentence(a.id));
      burstAt(card);
      blip(true);
      logEvent({ type: 'tap', word: a.id, correct: 1, misses: 0, ms: 0 });
      pay(noted.gained);
      playUrls([voiceClip(a.id)]);
      open = [];
      if (Object.keys(matched).length === deck.length) {
        if (!maybeClearSet()) {
          playUrls([cue('great')]).then(() => { if (gen === viewGen) renderMemory(); });
        }
      }
    } else {
      lock = true;
      S.streak = 0;
      save();
      setPrompt('Try again.');
      setTimeout(() => {
        if (gen !== viewGen) return;
        open.forEach(idx => {
          const el = stage.querySelector('[data-i="' + idx + '"]');
          const item = deck[idx];
          if (!el) return;
          el.classList.remove('up');
          el.innerHTML = item.type === 'snd'
            ? '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>'
            : '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5L19 18H5l3.5-4.5z"/></svg>';
        });
        open = [];
        lock = false;
      }, 900);
    }
  });
}

/* ---------- boot ---------- */
function renderMode() {
  if (S.mode === 'find') renderFind();
  else if (S.mode === 'speak') renderSpeak();
  else if (S.mode === 'memory') renderMemory();
  else { S.mode = 'drill'; renderDrill(); }
}
let holdAutoplay = false;
async function bootLesson() {
  renderHUD();
  const greet = !S.greeted && S.soundOn;
  if (greet) {
    S.greeted = true;
    save(false);
  }
  holdAutoplay = greet;
  renderMode();
  holdAutoplay = false;
  let seen = '';
  try { seen = sessionStorage.getItem('ttzr4_board') || ''; } catch (e) {}
  if (S.setCleared[S.setId] && seen !== S.setId) {
    try { sessionStorage.setItem('ttzr4_board', S.setId); } catch (e) {}
    showDone(curSet(), true);
    return;
  }
  if (!greet) return;
  await playUrls([cue('hello')]);
  if (S.mode === 'drill' && drill) hearDrill(false, drill.gen);
  else if (S.mode === 'find' && findRound) hearFind(false);
  else if (S.mode === 'speak' && speak) modelSpeak();
}
document.querySelectorAll('.mode-tab').forEach(b => b.onclick = () => {
  S.mode = b.dataset.mode;
  save(false);
  renderMode();
});
$('btnReplay').onclick = () => {
  ensureAudio();
  if (S.currentWord) {
    const gear = TT.gearOf(curSet().words, S.mastery);
    const kind = TT.stimulus(S.currentWord, S.mastery[S.currentWord], gear);
    playUrls([file(kind, S.currentWord)]);
  }
};
$('btnSound').onclick = () => {
  S.soundOn = !S.soundOn;
  if (!S.soundOn) { stopBeat(); stopTalk(); }
  else if (S.beatOn) startBeat();
  save(false);
};
$('hudGear').onclick = () => {
  ensureAudio();
  S.beatOn = !S.beatOn;
  if (S.beatOn && S.soundOn) startBeat(); else stopBeat();
  save(false);
};
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === ' ' && S.currentWord) { e.preventDefault(); $('btnReplay').click(); }
  if ((e.key === '1' || e.key === '2') && S.mode === 'drill') {
    const cards = stage.querySelectorAll('.pillar-card');
    const card = cards[e.key === '1' ? 0 : 1];
    if (card) card.click();
  }
});

renderHUD();
register();
bootLesson();

</script>
